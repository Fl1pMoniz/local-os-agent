[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "agent.py",
    "config.py",
    "schemas.py",
    "main.py",
    "tools",
    "voice",
    "ui",
    "app",
]

[project]
name = "local-os-agent"
version = "3.11.0"
description = "Production-ready local OS Agent connecting to local LLMs (Ollama/LM Studio) for desktop automation across media, gaming, system settings, and multitasking."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Fl1pMoniz" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]

# Core cross-platform runtime dependencies
dependencies = [
    "openai>=1.20.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "injector>=0.21.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "psutil>=5.9.0",
    "portalocker>=2.8.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "edge-tts>=7.0.0",
    "piper-tts>=1.2.0",
    "onnxruntime>=1.16.0",
    "SpeechRecognition>=3.10.0",
    "pillow>=10.0.0",
    "pyautogui>=0.9.54",
    "vdf>=3.4",
    "vpk>=1.4.0",
    "torch>=2.0.0",
    "openai-whisper>=20231117",
    # Platform-conditional dependencies: isolated so Linux/macOS installs remain clean
    "pycaw>=20240101; sys_platform == 'win32'",
    "comtypes>=1.2.0; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "pre-commit>=3.6.0",
]

# Universal console command entrypoints for any operating system terminal
[project.scripts]
glados = "main:cli_entrypoint"
glados-web = "ui.server:run_ui_app"

# Ruff linter and formatter configuration (fast Rust replacement for Black, Flake8, isort)
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort import sorting
    "UP",  # pyupgrade modernizations
    "B",   # flake8-bugbear safety checks
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function call in argument defaults
    "E402",  # Module level import not at top of file (legacy tool registrations)
    "W291",  # Trailing whitespace (ASCII art banners)
    "E731",  # Do not assign a lambda expression
    "B007",  # Loop control variable not used
]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "schemas", "tools", "voice", "ui"]

# Pytest test discovery and marker categorization
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "-ra",
    "--durations=10",
]
markers = [
    "unit: Pure unit tests with zero external or hardware dependencies",
    "cross_platform: Tests verifying behavior across Windows, Linux, and macOS environments",
    "headless: Tests verifying graceful degradation in container or server mode without audio or display",
    "agent: Tests for LangChain tool calling, prompt resolution, and Pydantic parameter validation",
    "integration: Tests exercising multi-component adapters (OBS, ZimaOS, ADS-B radar, Jellyfin)",
    "ui: Tests for the Amber CRT Web UI, SSE telemetry endpoints, and zero-emoji compliance",
    "slow: Tests that execute neural inference or multi-second timeouts (skipped in rapid test runs)",
]
filterwarnings = [
    "ignore::DeprecationWarning:speech_recognition.*",
    "ignore::ResourceWarning",
    "ignore::UserWarning:pydantic.*",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

