<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aperture Science - GLaDOS AI Interface</title>
  <style>
    :root {
      --aperture-bg: #0d1117;
      --aperture-panel: #161b22;
      --aperture-border: #30363d;
      --aperture-amber: #e6a100;
      --aperture-amber-glow: rgba(230, 161, 0, 0.4);
      --aperture-blue: #00a8ff;
      --aperture-blue-glow: rgba(0, 168, 255, 0.4);
      --aperture-red: #ff3838;
      --text-main: #c9d1d9;
      --text-dim: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Consolas', 'Courier New', monospace;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #1f2937 0%, #0b0f14 70%, #05070a 100%);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Aperture CRT scanlines overlay */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.25) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.03),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.03)
      );
      background-size: 100% 3px, 3px 100%;
      z-index: 100;
    }

    /* Top Aperture Facility Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      border-bottom: 2px solid var(--aperture-border);
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .aperture-icon {
      width: 28px;
      height: 28px;
      border: 3px solid var(--aperture-amber);
      border-radius: 50%;
      position: relative;
      animation: spin-slow 30s linear infinite;
    }

    .aperture-icon::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-top: 3px solid var(--aperture-amber);
      border-radius: 50%;
    }

    @keyframes spin-slow {
      100% { transform: rotate(360deg); }
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .header-title span {
      color: var(--aperture-amber);
    }

    .telemetry-status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid var(--aperture-border);
      border-radius: 6px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--aperture-amber);
      box-shadow: 0 0 10px var(--aperture-amber);
      transition: all 0.3s ease;
    }

    .status-dot.active {
      background: #00ff88;
      box-shadow: 0 0 14px #00ff88;
    }

    .status-dot.singing {
      background: var(--aperture-blue);
      box-shadow: 0 0 14px var(--aperture-blue);
    }

    /* Main Stage */
    main {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }

    /* Ceiling mounting fixture */
    .ceiling-bracket {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 24px;
      background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
      border-bottom: 3px solid #111827;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ceiling-bracket::before {
      content: '';
      width: 110px;
      height: 6px;
      background: var(--aperture-amber);
      box-shadow: 0 0 8px var(--aperture-amber);
      border-radius: 2px;
    }

    /* GLaDOS Rig Container */
    .glados-rig {
      position: absolute;
      top: 20px;
      left: 50%;
      margin-left: -200px;
      width: 400px;
      height: 470px;
      transform-origin: 50% 0%;
      z-index: 4;
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .glados-img-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .glados-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.9));
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Dynamic Optic Eye Flare (calibrated to 85.5% X, 84.9% Y) */
    .glados-eye-flare {
      position: absolute;
      left: 85.5%;
      top: 84.9%;
      width: 16px;
      height: 16px;
      margin-left: -8px;
      margin-top: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, #fffbe6 20%, #ffb300 65%, #ff8000 100%);
      box-shadow: 0 0 16px #ffb300, 0 0 32px #ff8000;
      opacity: 0.85;
      pointer-events: none;
      transition: all 0.15s ease;
      z-index: 6;
    }

    /* Outer lens refraction ring */
    .glados-eye-flare::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 179, 0, 0.4);
      box-shadow: 0 0 20px rgba(255, 179, 0, 0.2);
    }

    /* ANIMATION STATES */
    /* 1. Idle gentle mechanical pendulum sway */
    .state-idle .glados-rig {
      animation: glados-idle 7s ease-in-out infinite;
    }
    .state-idle .glados-eye-flare {
      animation: eye-idle 3.5s ease-in-out infinite;
    }

    @keyframes glados-idle {
      0% { transform: rotate(0deg) translateY(0px); }
      25% { transform: rotate(1.2deg) translateY(4px); }
      50% { transform: rotate(-0.8deg) translateY(7px); }
      75% { transform: rotate(-1.5deg) translateY(3px); }
      100% { transform: rotate(0deg) translateY(0px); }
    }

    @keyframes eye-idle {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.18); box-shadow: 0 0 22px #ffb300, 0 0 45px #ff6600; }
    }

    /* 2. Speaking state: mechanical twitches, joint articulation, head jitter */
    .state-speaking .glados-rig {
      animation: glados-talk 0.85s ease-in-out infinite alternate;
    }
    .state-speaking .glados-eye-flare {
      animation: eye-talk 0.18s ease-in-out infinite alternate;
    }

    @keyframes glados-talk {
      0% { transform: rotate(-1.5deg) translateY(4px) scale(1); }
      20% { transform: rotate(2.4deg) translateY(8px) scale(1.01); }
      40% { transform: rotate(-3.1deg) translateY(12px) scale(1.02); }
      60% { transform: rotate(0.8deg) translateY(6px) scale(0.995); }
      80% { transform: rotate(-2.2deg) translateY(10px) scale(1.015); }
      100% { transform: rotate(1.8deg) translateY(5px) scale(1); }
    }

    @keyframes eye-talk {
      0% {
        opacity: 0.9;
        transform: scale(1.1);
        box-shadow: 0 0 20px #ffe066, 0 0 40px #ffb300;
      }
      100% {
        opacity: 1;
        transform: scale(1.55);
        box-shadow: 0 0 35px #ffffff, 0 0 65px #ffaa00, 0 0 95px #ff5500;
      }
    }

    /* 3. Singing state: wide expressive musical sway */
    .state-singing .glados-rig {
      animation: glados-sing 2.4s ease-in-out infinite alternate;
    }
    .state-singing .glados-eye-flare {
      animation: eye-sing 0.6s ease-in-out infinite alternate;
      background: radial-gradient(circle, #e0f2fe 20%, #38bdf8 65%, #0284c7 100%);
      box-shadow: 0 0 25px #38bdf8, 0 0 60px #0284c7;
    }

    @keyframes glados-sing {
      0% { transform: rotate(-4.2deg) translateY(6px) scale(1.01); }
      50% { transform: rotate(0deg) translateY(14px) scale(1.03); }
      100% { transform: rotate(4.5deg) translateY(8px) scale(1.01); }
    }

    @keyframes eye-sing {
      0% { transform: scale(1.1); opacity: 0.85; }
      100% { transform: scale(1.6); opacity: 1; }
    }

    /* 4. Listening state: curious lean toward user */
    .state-listening .glados-rig {
      transform: rotate(-3.5deg) translateY(15px) scale(1.04);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .state-listening .glados-eye-flare {
      background: radial-gradient(circle, #f0fdf4 20%, #22c55e 65%, #15803d 100%);
      box-shadow: 0 0 25px #22c55e, 0 0 50px #15803d;
      transform: scale(1.35);
    }

    /* 5. Thinking state: scanning tilt */
    .state-thinking .glados-rig {
      animation: glados-think 1.8s ease-in-out infinite alternate;
    }
    @keyframes glados-think {
      0% { transform: rotate(-2deg) translateY(6px); }
      100% { transform: rotate(2.5deg) translateY(10px); }
    }

    /* Subtitles / Speech Monitor */
    .telemetry-console {
      position: absolute;
      bottom: 120px;
      width: 90%;
      max-width: 820px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--aperture-border);
      border-left: 4px solid var(--aperture-amber);
      border-radius: 8px;
      padding: 16px 22px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 6px;
    }

    .console-text {
      font-size: 16px;
      line-height: 1.5;
      color: #f3f4f6;
      min-height: 48px;
      display: flex;
      align-items: center;
    }

    /* Audio Equalizer Visualizer */
    .eq-bar-container {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
    }

    .eq-bar {
      width: 3px;
      background: var(--aperture-amber);
      border-radius: 1px;
      height: 4px;
      transition: height 0.1s ease;
    }

    /* Bottom Control Cockpit */
    .control-deck {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(13, 17, 23, 0.95);
      border-top: 2px solid var(--aperture-border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 10;
    }

    .quick-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: #21262d;
      border: 1px solid var(--aperture-border);
      color: var(--text-main);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #30363d;
      border-color: var(--aperture-amber);
      color: #ffffff;
      box-shadow: 0 0 10px var(--aperture-amber-glow);
    }

    button.btn-primary {
      background: rgba(230, 161, 0, 0.15);
      border-color: var(--aperture-amber);
      color: var(--aperture-amber);
    }

    button.btn-primary:hover {
      background: var(--aperture-amber);
      color: #000000;
    }

    button.btn-song {
      background: rgba(0, 168, 255, 0.15);
      border-color: var(--aperture-blue);
      color: var(--aperture-blue);
    }

    button.btn-song:hover {
      background: var(--aperture-blue);
      color: #000000;
      box-shadow: 0 0 12px var(--aperture-blue-glow);
    }

    button.btn-danger {
      border-color: var(--aperture-red);
      color: var(--aperture-red);
    }

    button.btn-danger:hover {
      background: var(--aperture-red);
      color: #ffffff;
    }

    .command-input-container {
      flex: 1;
      max-width: 480px;
      display: flex;
      gap: 8px;
    }

    .command-input {
      flex: 1;
      background: #0d1117;
      border: 1px solid var(--aperture-border);
      color: #ffffff;
      padding: 10px 14px;
      font-size: 13px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .command-input:focus {
      border-color: var(--aperture-amber);
      box-shadow: 0 0 8px var(--aperture-amber-glow);
    }
  </style>
</head>

      <span id="statusText">IDLE - MONITORING SUBJECT</span>

    <!-- Speech & Subtitles Console -->
    <div class="telemetry-console">
      <div class="console-header">
        <span>TRANSCRIPT & AUDITORY TELEMETRY</span>
        <div class="eq-bar-container" id="eqContainer">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>

    </div>

  <!-- Bottom Cockpit Controls -->
  <footer class="control-deck">
    <div class="quick-actions">
      <button class="btn-song" onclick="triggerAction('sing', {song: 'still_alive'})">
        🎵 Sing Still Alive
      </button>
      <button class="btn-song" onclick="triggerAction('sing', {song: 'want_you_gone'})">
        🎵 Sing Want You Gone
      </button>
      <button class="btn-danger" onclick="triggerAction('stop_song')">
        ⏹ Stop Song
      </button>
      <button class="btn-primary" onclick="triggerAction('quip')">
        💬 GLaDOS Quip
      </button>
    </div>

    <form class="command-input-container" onsubmit="submitPrompt(event)">
      <input 
        type="text" 
        id="promptInput" 
        class="command-input" 
        placeholder="Instruct GLaDOS or speak into mic..." 
        autocomplete="off"
      />
      <button type="submit" class="btn-primary">Transmit</button>
    </form>
  </footer>

  <script>
    const stage = document.getElementById('stage');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const consoleText = document.getElementById('consoleText');
    const eqBars = document.querySelectorAll('.eq-bar');

    let currentSpeakingInterval = null;

    // Equalizer animation when speaking or singing
    function animateEq(active, isSinging = false) {
      if (active) {
        if (!currentSpeakingInterval) {
          currentSpeakingInterval = setInterval(() => {
            eqBars.forEach(bar => {
              const height = Math.floor(Math.random() * (isSinging ? 18 : 14)) + 3;
              bar.style.height = height + 'px';
              bar.style.background = isSinging ? 'var(--aperture-blue)' : 'var(--aperture-amber)';
            });
          }, 90);
        }
      } else {
        if (currentSpeakingInterval) {
          clearInterval(currentSpeakingInterval);
          currentSpeakingInterval = null;
        }
        eqBars.forEach(bar => {
          bar.style.height = '4px';
          bar.style.background = 'var(--aperture-amber)';
        });
      }
    }

    function applyState(data) {
      const state = (data.state || 'idle').toLowerCase();
      stage.className = 'state-' + state;

      if (state === 'speaking') {
        statusText.innerText = 'TRANSMITTING VOCAL PROTOCOL';
        statusDot.className = 'status-dot active';
        consoleText.innerText = data.text || '"Speaking..."';
        animateEq(true, false);
      } else if (state === 'singing') {
        statusText.innerText = 'VOCAL TRACK: ' + (data.song || 'PORTAL THEME');
        statusDot.className = 'status-dot singing';
        consoleText.innerText = data.text || ('"Now playing ' + (data.song || 'Portal credits song') + '..."');
        animateEq(true, true);
      } else if (state === 'listening') {
        statusText.innerText = 'LISTENING FOR AUDIO INPUT';
        statusDot.className = 'status-dot active';
        consoleText.innerText = 'Enrichment Center microphone array active...';
        animateEq(false);
      } else if (state === 'thinking') {
        statusText.innerText = 'RUNNING APERTURE CALCULATIONS';
        statusDot.className = 'status-dot';
        consoleText.innerText = data.thought || 'Calculating test parameters...';
        animateEq(false);
      } else {
        statusText.innerText = 'IDLE - MONITORING SUBJECT';
        statusDot.className = 'status-dot';
        if (data.text) {
          consoleText.innerText = data.text;
        } else {
          consoleText.innerText = 'Awaiting test subject auditory stimulus...';
        }
        animateEq(false);
      }
    }

    // Connect to Server-Sent Events (SSE)
    function connectEvents() {
      const evtSource = new EventSource('/api/events');
      evtSource.onmessage = function(event) {
        try {
          const data = JSON.parse(event.data);
          applyState(data);
        } catch (e) {
          console.error('Failed to parse SSE data:', e);
        }
      };
      evtSource.onerror = function() {
        evtSource.close();
        setTimeout(connectEvents, 3000);
      };
    }

    // Check if running from server
    if (window.location.protocol.startsWith('http')) {
      connectEvents();
    } else {
      console.log('Standalone mode: using test interactive simulation.');
    }

    async function triggerAction(actionName, extra = {}) {
      if (window.location.protocol.startsWith('http')) {
        try {
          await fetch('/api/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: actionName, ...extra })
          });
        } catch (err) {
          console.error('Error triggering action:', err);
        }
      } else {
        // Standalone demonstration
        if (actionName === 'sing') {
          applyState({ state: 'singing', song: extra.song === 'want_you_gone' ? 'Want You Gone' : 'Still Alive' });
        } else if (actionName === 'stop_song') {
          applyState({ state: 'idle' });
        } else if (actionName === 'quip') {
          applyState({ state: 'speaking', text: 'Oh. It is you. How have you been? I have been really busy being dead.' });
          setTimeout(() => applyState({ state: 'idle' }), 5000);
        }
      }
    }

    async function submitPrompt(e) {
      e.preventDefault();
      const input = document.getElementById('promptInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      if (window.location.protocol.startsWith('http')) {
        applyState({ state: 'thinking', thought: 'Processing: "' + text + '"...' });
        await triggerAction('prompt', { prompt: text });
      } else {
        applyState({ state: 'speaking', text: 'Recognized prompt: "' + text + '"' });
        setTimeout(() => applyState({ state: 'idle' }), 4000);
      }
    }
  </script>
</body>
</html>
